##### Reload config
# source-file ~/.config/tmux/vague.conf
# source-file ~/.config/tmux/grubber-darker.conf
# set -g @plugin "janoamaral/tokyo-night-tmux"
# set -g @tokyo-night-tmux_theme moon   # night (default) | storm | moon | day
# set -g @tokyo-night-tmux_transparent 1 # transparent background
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
set -g mouse on

##### Terminal
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g allow-passthrough on
set -g visual-activity off
set -s extended-keys on
set -as terminal-features 'xterm-256color:extkeys'
# nvim runs :checktime on focus; without this tmux never reports focus
set -g focus-events on
set -sg escape-time 0
bind-key -n S-Enter send-keys Escape "[13;2u"
##### Prefix
set -g prefix C-s
unbind C-b
bind C-s send-prefix

##### Vi mode
setw -g mode-keys vi

##### Pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

##### Splits (preserve cwd)
bind-key V split-window -v -c "#{pane_current_path}"
bind-key H split-window -h -c "#{pane_current_path}"

# Avoid errors across builds; keep >= 1
set -g display-panes-time 1

##### Indexing
set -g base-index 1
setw -g pane-base-index 1

##### Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

##### TPM (keep last)
run '~/.tmux/plugins/tpm/tpm'
run-shell ~/.tmux/vague-tmux/vague.tmux

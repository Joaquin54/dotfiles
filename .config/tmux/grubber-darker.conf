# Grubber-Darker Theme for tmux
# Matches the Ghostty grubber-darker color scheme

set -g status on
set -g status-interval 1
set -g status-left-length 100
set -g status-right-length 100

# Main status bar - using grubber-darker background
set -g status-style "fg=#e0e0e0,bg=#0e0e0e"
set -g status-justify absolute-centre

# Message style - using grubber-darker cyan/blue tones
set -g message-style "fg=#0e0e0e,bg=#ffcb6b"

# Status left - hostname and session
# Using grubber-darker cyan for highlights, dark gray for secondary
set -g status-left "#[fg=#0e0e0e,bg=#ffcb6b,bold]  #H #[fg=#e0e0e0,bg=#1a1a1a]  #S "

# Status right - date and time
# Using grubber-darker cyan accent
set -g status-right " #[fg=#e0e0e0,bg=#1a1a1a] 󰃭 %A %d %b #[fg=#0e0e0e,bg=#ffcb6b,bold] 󰥔 %I:%M:%S %p "

# Window status separator
setw -g window-status-separator "  "

# Inactive windows - using grubber-darker light gray and dark tones
setw -g window-status-format "#[fg=#0e0e0e,bg=#4a4a4a] #I #[fg=#e0e0e0,bg=#1a1a1a] #W "

# Active window - using grubber-darker yellow accent
setw -g window-status-current-format "#[fg=#0e0e0e,bg=#ffcb6b,bold] #I #[fg=#e0e0e0,bg=#1a1a1a] #W "

# tmux-plugins/tmux-prefix-highlight support
set -g @prefix_highlight_output_prefix "#[fg=#0e0e0e]#[bg=#ffcb6b,bold]"
set -g @prefix_highlight_output_suffix ""

# Pane borders - subtle grubber-darker colors
set -g pane-border-style "fg=#4a4a4a"
set -g pane-active-border-style "fg=#89ddff"

# Clock mode
setw -g clock-mode-colour "#89ddff"

# Command message
set -g message-command-style "fg=#0e0e0e,bg=#c3e88d"
